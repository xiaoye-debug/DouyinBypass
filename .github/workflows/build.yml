name: Build DouyinBypass

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        brew install ldid dpkg

    - name: Build DEB (Tweak)
      env:
        THEOS: ${{ github.workspace }}/../../theos
      run: |
        export THEOS=$HOME/theos
        make package FINALPACKAGE=1

    - name: Build Dylib (IPA Injection)
      env:
        THEOS: ${{ github.workspace }}/../../theos
      run: |
        export THEOS=$HOME/theos
        make build-dylib

    - name: Upload DEB (Jailbreak)
      uses: actions/upload-artifact@v4
      with:
        name: DouyinBypass-deb
        path: packages/*.deb
        if-no-files-found: warn

    - name: Upload Dylib (IPA Injection)
      uses: actions/upload-artifact@v4
      with:
        name: DouyinBypass-dylib
        path: packages/DouyinBypass.dylib
        if-no-files-found: warn

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          packages/*.deb
          packages/DouyinBypass.dylib
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
